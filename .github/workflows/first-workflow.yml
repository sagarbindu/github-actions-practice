name: my First Github actions pipeline

# on:
#   push:
#     branches: 
#       - main

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select deployment environment
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

jobs:
  firstjob:
    runs-on: ubuntu-latest

    steps:
      - name: Print msg
        run: echo "Hi"

      - name: Check Linux version
        run: uname -a

      - name: Check working directory
        run: pwd

      - name: List files
        run: ls -la
